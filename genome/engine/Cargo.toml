[package]
name = "genome-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
hound = "3.5"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3", "flac", "vorbis", "ogg", "wav", "alac", "pcm"] }

[profile.release]
opt-level = 3
lto = true
