<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>nw_wrld / Genome World</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151715;color:#ddd}
    #web-toolbar{height:40px;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid #333;font:11px monospace;box-sizing:border-box}
    #web-toolbar strong{color:#fff;letter-spacing:.12em}#web-toolbar button{color:#ddd;border:1px solid #555;background:transparent;padding:5px 9px;cursor:pointer;font:inherit}
    #workspace-status{margin-right:auto;color:#aaa}#web-content{height:calc(100vh - 40px);display:grid;grid-template-columns:minmax(540px,1fr) minmax(380px,40vw)}
    #dashboard-frame{height:100%;width:100%;min-width:0;border:0;background:#101010}#projector-preview{width:100%;height:100%;border:0;border-left:1px solid #333;background:#05090c}
    @media(max-width:1000px){#web-content{grid-template-columns:minmax(0,1fr);grid-template-rows:60% 40%}#projector-preview{border-left:0;border-top:1px solid #333}}
  </style>
</head>
<body>
  <header id="web-toolbar"><strong>nw_wrld</strong><span id="workspace-status">Opening workspace…</span><button id="enable-midi" type="button">Enable MIDI</button><button id="open-projector" type="button">Open projector</button></header>
  <main id="web-content"><iframe id="dashboard-frame" src="/dashboard.html" title="nw_wrld dashboard" allow="midi; microphone"></iframe><iframe id="projector-preview" title="nw_wrld projector" allow="autoplay; fullscreen"></iframe></main>
  <script type="module" src="/web/shell.ts"></script>
</body>
</html>
